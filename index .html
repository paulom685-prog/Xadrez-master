<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>BazarExpress · PDV Leve</title>
    <!-- Google Fonts + Font Awesome -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #F4F6FB;
            color: #1A2C3E;
            overflow: hidden;
            height: 100vh;
        }

        /* Cores suaves e elegantes */
        :root {
            --bg-body: #F4F6FB;
            --bg-sidebar: #FFFFFF;
            --bg-card: #FFFFFF;
            --bg-soft: #F8FAFE;
            --border-light: #E9EDF2;
            --border-focus: #CFDDEB;
            --text-primary: #1F2B3C;
            --text-secondary: #5F6F8A;
            --text-muted: #8A99B4;
            --accent: #DE7A2B;
            --accent-soft: #FFF2E6;
            --accent-hover: #C86618;
            --success: #2A9D6E;
            --success-bg: #E6F5EE;
            --danger: #DC5B5B;
            --danger-bg: #FDEFEF;
            --warning: #E5A43A;
            --warning-bg: #FEF5E8;
            --info: #4F7A9E;
            --shadow-sm: 0 2px 6px rgba(0, 0, 0, 0.03), 0 1px 2px rgba(0, 0, 0, 0.02);
            --shadow-md: 0 8px 20px rgba(0, 0, 0, 0.05);
        }

        /* Layout principal */
        .app {
            display: flex;
            height: 100vh;
            width: 100%;
        }

        /* Sidebar esquerda */
        .sidebar {
            width: 270px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border-light);
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-sm);
            z-index: 5;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 32px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-light);
        }

        .logo-icon {
            width: 44px;
            height: 44px;
            background: var(--accent);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 22px;
        }

        .logo-text {
            font-weight: 700;
            font-size: 20px;
            color: var(--text-primary);
        }

        .logo-text span {
            color: var(--accent);
        }

        .nav {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .nav-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 14px;
            font-weight: 500;
            font-size: 14px;
            background: transparent;
            border: none;
            cursor: pointer;
            color: var(--text-secondary);
            transition: 0.2s;
            text-align: left;
        }

        .nav-btn i {
            width: 22px;
            font-size: 16px;
        }

        .nav-btn:hover {
            background: var(--bg-soft);
            color: var(--text-primary);
        }

        .nav-btn.active {
            background: var(--accent-soft);
            color: var(--accent);
        }

        .bottom-nav {
            margin-top: auto;
            padding-top: 20px;
        }

        /* Conteúdo principal */
        .main-area {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        .content-pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 20px 24px;
        }

        /* Barra de busca e categorias */
        .search-section {
            margin-bottom: 20px;
        }

        .search-box {
            background: white;
            border-radius: 32px;
            border: 1px solid var(--border-light);
            padding: 10px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: var(--shadow-sm);
        }

        .search-box i {
            color: var(--text-muted);
        }

        .search-box input {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            font-size: 14px;
        }

        .category-strip {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            margin: 16px 0 20px 0;
            padding-bottom: 6px;
        }

        .cat-chip {
            padding: 8px 20px;
            background: white;
            border: 1px solid var(--border-light);
            border-radius: 40px;
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-secondary);
        }

        .cat-chip.active {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }

        /* Grid de produtos */
        .products-grid {
            flex: 1;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
            gap: 18px;
            padding-right: 4px;
        }

        .product-card {
            background: var(--bg-card);
            border-radius: 24px;
            border: 1px solid var(--border-light);
            padding: 18px 14px;
            transition: all 0.2s ease;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
        }

        .product-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent);
            box-shadow: var(--shadow-md);
        }

        .product-emoji {
            font-size: 42px;
            background: var(--bg-soft);
            width: 64px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 24px;
            margin-bottom: 14px;
        }

        .product-name {
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 6px;
        }

        .product-price {
            font-weight: 700;
            font-size: 18px;
            color: var(--accent);
            font-family: 'JetBrains Mono', monospace;
        }

        .product-stock {
            font-size: 11px;
            margin-top: 8px;
            color: var(--text-muted);
        }

        /* Painel do carrinho (direita) */
        .cart-panel {
            width: 400px;
            background: white;
            border-left: 1px solid var(--border-light);
            display: flex;
            flex-direction: column;
            box-shadow: -4px 0 12px rgba(0, 0, 0, 0.02);
        }

        .cart-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart-title {
            font-weight: 700;
            font-size: 18px;
        }

        .clear-cart {
            background: var(--danger-bg);
            border: none;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 12px;
            color: var(--danger);
            cursor: pointer;
        }

        .client-info {
            padding: 14px 20px;
            background: var(--bg-soft);
            border-bottom: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .client-avatar {
            width: 40px;
            height: 40px;
            background: white;
            border-radius: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
            border: 1px solid var(--border-light);
        }

        .client-details {
            flex: 1;
        }

        .client-name {
            font-weight: 600;
            font-size: 14px;
        }

        .change-client {
            background: transparent;
            border: 1px solid var(--border-light);
            border-radius: 30px;
            padding: 6px 12px;
            font-size: 12px;
            cursor: pointer;
        }

        .cart-items-list {
            flex: 1;
            overflow-y: auto;
            padding: 4px 0;
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 20px;
            border-bottom: 1px solid var(--border-light);
        }

        .cart-item-icon {
            width: 44px;
            height: 44px;
            background: #F4F6FB;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .cart-item-info {
            flex: 1;
        }

        .cart-item-name {
            font-weight: 500;
        }

        .cart-item-price {
            font-size: 12px;
            color: var(--text-muted);
        }

        .qty-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .qty-btn {
            width: 28px;
            height: 28px;
            border-radius: 10px;
            border: 1px solid var(--border-light);
            background: white;
            cursor: pointer;
            font-weight: bold;
        }

        .cart-item-total {
            font-family: monospace;
            font-weight: 600;
            min-width: 85px;
            text-align: right;
        }

        .cart-totals {
            padding: 20px;
            border-top: 1px solid var(--border-light);
            background: white;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .discount-input {
            width: 70px;
            padding: 6px;
            border-radius: 12px;
            border: 1px solid var(--border-light);
            text-align: center;
        }

        .grand-total {
            font-weight: 800;
            font-size: 22px;
            color: var(--accent);
            margin-top: 12px;
            padding-top: 12px;
            border-top: 2px dashed var(--border-light);
        }

        .cart-actions {
            padding: 16px 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        .btn-secondary {
            background: #F1F4F9;
            border: 1px solid var(--border-light);
            padding: 12px;
            border-radius: 40px;
            font-weight: 500;
            cursor: pointer;
        }

        /* MODAIS */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(3px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .modal {
            background: white;
            border-radius: 32px;
            width: 90%;
            max-width: 520px;
            max-height: 85vh;
            overflow: auto;
            box-shadow: var(--shadow-md);
        }

        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            font-weight: 700;
            font-size: 18px;
        }

        .modal-body {
            padding: 24px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            margin-bottom: 6px;
            color: var(--text-secondary);
        }

        .form-control {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-light);
            border-radius: 16px;
            font-family: inherit;
        }

        .modal-footer {
            padding: 16px 24px;
            border-top: 1px solid var(--border-light);
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #1F2B3C;
            color: white;
            padding: 12px 24px;
            border-radius: 48px;
            font-size: 13px;
            z-index: 3000;
            animation: fadeUp 0.2s ease;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        ::-webkit-scrollbar {
            width: 5px;
        }
    </style>
</head>
<body>
<div class="app">
    <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="logo-area">
            <div class="logo-icon"><i class="fas fa-store"></i></div>
            <div class="logo-text">Bazar<span>Express</span></div>
        </div>
        <div class="nav">
            <button class="nav-btn active" data-view="pdv"><i class="fas fa-cash-register"></i> Vendas (PDV)</button>
            <button class="nav-btn" data-view="products"><i class="fas fa-boxes"></i> Produtos</button>
            <button class="nav-btn" data-view="clients"><i class="fas fa-users"></i> Clientes</button>
            <button class="nav-btn" data-view="reports"><i class="fas fa-chart-line"></i> Histórico</button>
        </div>
        <div class="bottom-nav">
            <button class="nav-btn" onclick="openSettingsModal()"><i class="fas fa-cog"></i> Configurações</button>
        </div>
    </div>

    <!-- CONTEÚDO PRINCIPAL -->
    <div class="main-area">
        <div class="content-pane" id="contentPane">
            <!-- PDV View -->
            <div id="pdvView">
                <div class="search-section">
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" id="searchInput" placeholder="Buscar produto por nome..." oninput="filterProducts()">
                    </div>
                    <div class="category-strip" id="categoryStrip"></div>
                </div>
                <div class="products-grid" id="productsGrid"></div>
            </div>
            <!-- Gestão Produtos -->
            <div id="productsView" style="display: none;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                    <h2 style="font-size: 22px;">Produtos</h2>
                    <button class="btn-primary" style="padding: 10px 20px;" onclick="openProductForm()"><i class="fas fa-plus"></i> Novo</button>
                </div>
                <div id="productsManagementList" class="products-grid" style="grid-template-columns: repeat(auto-fill, minmax(220px,1fr));"></div>
            </div>
            <!-- Gestão Clientes -->
            <div id="clientsView" style="display: none;">
                <div style="display: flex; justify-content: space-between; margin-bottom: 24px;">
                    <h2>Clientes</h2>
                    <button class="btn-primary" onclick="openClientForm()"><i class="fas fa-user-plus"></i> Novo Cliente</button>
                </div>
                <div id="clientsListContainer" style="display: flex; flex-direction: column; gap: 12px;"></div>
            </div>
            <!-- Histórico Vendas -->
            <div id="reportsView" style="display: none;">
                <h2 style="margin-bottom: 20px;">Histórico de Vendas</h2>
                <div id="statsCards" style="display: flex; gap: 20px; margin-bottom: 28px;"></div>
                <div style="background: white; border-radius: 24px; overflow: auto; border: 1px solid var(--border-light);">
                    <table style="width: 100%; border-collapse: collapse;">
                        <thead style="background: #F8FAFE;"><tr><th>ID</th><th>Data/Hora</th><th>Cliente</th><th>Total</th><th>Pagamento</th></tr></thead>
                        <tbody id="salesHistoryBody"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- CARRINHO (lateral direita) -->
        <div class="cart-panel" id="cartPanel">
            <div class="cart-header">
                <div class="cart-title"><i class="fas fa-receipt" style="margin-right: 8px;"></i> Carrinho</div>
                <button class="clear-cart" onclick="clearCart()">Limpar tudo</button>
            </div>
            <div class="client-info">
                <div class="client-avatar"><i class="fas fa-user"></i></div>
                <div class="client-details">
                    <div class="client-name" id="selectedClientName">Consumidor Final</div>
                    <div style="font-size: 11px; color: var(--text-muted);">Cliente comum</div>
                </div>
                <button class="change-client" onclick="openClientSelector()">Trocar</button>
            </div>
            <div class="cart-items-list" id="cartList">
                <div style="text-align: center; padding: 50px 20px; color: var(--text-muted);">Carrinho vazio</div>
            </div>
            <div class="cart-totals">
                <div class="total-row"><span>Subtotal</span><span id="cartSubtotal">R$ 0,00</span></div>
                <div class="total-row"><span>Desconto (%) <input type="number" id="discountPercent" class="discount-input" value="0" min="0" max="100" step="1" oninput="refreshCartTotals()"></span><span id="discountAmount">- R$ 0,00</span></div>
                <div class="total-row grand-total"><span>Total</span><span id="cartTotalAmount">R$ 0,00</span></div>
            </div>
            <div class="cart-actions">
                <button class="btn-primary" id="checkoutBtn" onclick="openPaymentModal()">Finalizar Venda</button>
                <button class="btn-secondary" onclick="holdCurrentCart()"><i class="fas fa-pause"></i> Pendenciar venda</button>
                <button class="btn-secondary" onclick="openHeldOrdersModal()"><i class="fas fa-clock"></i> Vendas pendentes</button>
            </div>
        </div>
    </div>
</div>

<!-- MODAIS -->
<div id="paymentModal" class="modal-overlay"><div class="modal"><div class="modal-header">Forma de Pagamento<button onclick="closeModal('paymentModal')">✕</button></div><div class="modal-body"><div style="font-size: 32px; font-weight: bold; margin-bottom: 20px;" id="paymentTotalDisplay">R$ 0,00</div><div style="display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px;"><button class="btn-secondary pay-method" data-method="dinheiro">💵 Dinheiro</button><button class="btn-secondary pay-method" data-method="pix">📱 PIX</button><button class="btn-secondary pay-method" data-method="debito">💳 Débito</button><button class="btn-secondary pay-method" data-method="credito">💳 Crédito</button></div><div id="cashSection"><label>Valor recebido (R$)</label><input type="number" id="cashReceivedInput" class="form-control" step="0.01" placeholder="0,00"><div id="changeInfo" style="margin-top: 10px; color: var(--success);"></div></div></div><div class="modal-footer"><button class="btn-secondary" onclick="closeModal('paymentModal')">Cancelar</button><button class="btn-primary" onclick="finalizeSale()">Confirmar</button></div></div></div>

<div id="clientSelectModal" class="modal-overlay"><div class="modal"><div class="modal-header">Selecionar Cliente<button onclick="closeModal('clientSelectModal')">✕</button></div><div class="modal-body"><input type="text" id="clientSearchField" class="form-control" placeholder="Buscar..." oninput="renderClientSelectList()"><div id="clientSelectList" style="margin-top: 16px; max-height: 300px; overflow-y: auto;"></div></div><div class="modal-footer"><button class="btn-secondary" onclick="selectClient(null)">Consumidor Final</button></div></div></div>

<div id="productFormModal" class="modal-overlay"><div class="modal"><div class="modal-header" id="productModalTitle">Produto<button onclick="closeModal('productFormModal')">✕</button></div><div class="modal-body"><input type="hidden" id="editProductId"><div class="form-group"><label>Nome</label><input id="prodName" class="form-control"></div><div class="form-group"><label>Preço (R$)</label><input id="prodPrice" class="form-control" type="number" step="0.01"></div><div class="form-group"><label>Estoque</label><input id="prodStock" class="form-control" type="number"></div><div class="form-group"><label>Categoria</label><input id="prodCategory" class="form-control"></div><div class="form-group"><label>Ícone (emoji)</label><input id="prodIcon" class="form-control" value="📦"></div></div><div class="modal-footer"><button class="btn-secondary" onclick="closeModal('productFormModal')">Cancelar</button><button class="btn-primary" onclick="saveProduct()">Salvar</button></div></div></div>

<div id="clientFormModal" class="modal-overlay"><div class="modal"><div class="modal-header">Cliente<button onclick="closeModal('clientFormModal')">✕</button></div><div class="modal-body"><input type="hidden" id="editClientId"><div class="form-group"><label>Nome completo</label><input id="clientFullName" class="form-control"></div><div class="form-group"><label>CPF</label><input id="clientCpf" class="form-control"></div><div class="form-group"><label>Telefone</label><input id="clientPhone" class="form-control"></div></div><div class="modal-footer"><button class="btn-secondary" onclick="closeModal('clientFormModal')">Cancelar</button><button class="btn-primary" onclick="saveClient()">Salvar</button></div></div></div>

<div id="heldOrdersModal" class="modal-overlay"><div class="modal"><div class="modal-header">Vendas Pendentes<button onclick="closeModal('heldOrdersModal')">✕</button></div><div class="modal-body" id="heldOrdersListContainer"></div></div></div>

<div id="settingsModal" class="modal-overlay"><div class="modal"><div class="modal-header">Configurações<button onclick="closeModal('settingsModal')">✕</button></div><div class="modal-body"><div class="form-group"><label>Nome da Loja</label><input id="storeNameInput" class="form-control"></div><div class="form-group"><label>CNPJ</label><input id="storeCnpjInput" class="form-control"></div><button class="btn-secondary" style="background: var(--danger-bg); color: var(--danger);" onclick="resetSystem()">Resetar todos os dados</button></div><div class="modal-footer"><button class="btn-primary" onclick="saveSettings()">Salvar</button></div></div></div>

<script>
    // ==================== ESTADO GLOBAL ====================
    let state = {
        products: [
            { id: 1, name: "Copo Térmico 500ml", price: 24.9, stock: 42, category: "Cozinha", icon: "🥤", cost: 12 },
            { id: 2, name: "Organizador de Gavetas", price: 18.5, stock: 28, category: "Organização", icon: "🗄️", cost: 8 },
            { id: 3, name: "Jogo de Facas 6pç", price: 49.9, stock: 12, category: "Cozinha", icon: "🔪", cost: 22 },
            { id: 4, name: "Almofada Decorativa", price: 39.9, stock: 9, category: "Decoração", icon: "🛋️", cost: 18 },
            { id: 5, name: "Porta Temperos", price: 32.0, stock: 18, category: "Cozinha", icon: "🧂", cost: 14 },
            { id: 6, name: "Cabide de Madeira", price: 14.9, stock: 35, category: "Organização", icon: "🧥", cost: 6 },
        ],
        clients: [
            { id: 1, name: "Ana Clara Souza", cpf: "123.456.789-00", phone: "(11) 98765-4321", type: "fidelidade" },
            { id: 2, name: "Carlos Eduardo Lima", cpf: "234.567.890-11", phone: "(11) 97654-3210", type: "comum" }
        ],
        cart: [], // { productId, qty }
        selectedClient: null,
        sales: [],
        heldOrders: [],
        settings: { storeName: "BazarExpress", cnpj: "12.345.678/0001-90" },
        nextProductId: 7,
        nextClientId: 3,
        nextSaleId: 1,
        nextHeldId: 1,
        activeCategory: "Todos",
        currentView: "pdv",
        selectedPaymentMethod: "dinheiro"
    };

    // Helpers
    function formatCurrency(value) { return "R$ " + value.toFixed(2).replace(".", ","); }
    function showToast(msg) { let t = document.createElement("div"); t.className = "toast"; t.innerHTML = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2500); }
    function saveToLocalStorage() { localStorage.setItem("bazarexpress_data", JSON.stringify(state)); }
    function loadFromLocalStorage() {
        let data = localStorage.getItem("bazarexpress_data");
        if(data) { Object.assign(state, JSON.parse(data)); }
        else saveToLocalStorage();
    }
    function closeModal(id) { document.getElementById(id).style.display = "none"; }
    function openModal(id) { document.getElementById(id).style.display = "flex"; }

    // Navegação entre telas
    function switchView(view) {
        state.currentView = view;
        document.getElementById("pdvView").style.display = view === "pdv" ? "block" : "none";
        document.getElementById("productsView").style.display = view === "products" ? "block" : "none";
        document.getElementById("clientsView").style.display = view === "clients" ? "block" : "none";
        document.getElementById("reportsView").style.display = view === "reports" ? "block" : "none";
        document.querySelectorAll(".nav-btn").forEach(btn => btn.classList.remove("active"));
        document.querySelector(`.nav-btn[data-view="${view}"]`).classList.add("active");
        if(view === "products") renderProductsManagement();
        if(view === "clients") renderClientsList();
        if(view === "reports") renderReports();
    }

    // ===================== PDV =====================
    function renderCategories() {
        let cats = ["Todos", ...new Set(state.products.map(p => p.category))];
        let html = cats.map(c => `<button class="cat-chip ${state.activeCategory === c ? 'active' : ''}" onclick="setCategory('${c}')">${c}</button>`).join("");
        document.getElementById("categoryStrip").innerHTML = html;
    }
    function setCategory(cat) { state.activeCategory = cat; renderCategories(); filterProducts(); }
    function filterProducts() {
        let search = document.getElementById("searchInput").value.toLowerCase();
        let filtered = state.products.filter(p => (state.activeCategory === "Todos" || p.category === state.activeCategory) && p.name.toLowerCase().includes(search));
        document.getElementById("productsGrid").innerHTML = filtered.map(p => `
            <div class="product-card" onclick="addToCart(${p.id})">
                <div class="product-emoji">${p.icon}</div>
                <div class="product-name">${p.name}</div>
                <div class="product-price">${formatCurrency(p.price)}</div>
                <div class="product-stock">estoque: ${p.stock}</div>
            </div>
        `).join("");
    }
    function addToCart(pid) {
        let prod = state.products.find(p => p.id === pid);
        if(!prod || prod.stock <= 0) { showToast("Produto sem estoque"); return; }
        let existing = state.cart.find(i => i.productId === pid);
        if(existing) { if(existing.qty < prod.stock) existing.qty++; else { showToast("Estoque insuficiente"); return; } }
        else state.cart.push({ productId: pid, qty: 1 });
        renderCart();
        showToast(`${prod.name} adicionado`);
    }
    function updateCartQty(pid, delta) {
        let item = state.cart.find(i => i.productId === pid);
        if(!item) return;
        let prod = state.products.find(p => p.id === pid);
        item.qty += delta;
        if(item.qty < 1) state.cart = state.cart.filter(i => i.productId !== pid);
        else if(item.qty > prod.stock) item.qty = prod.stock;
        renderCart();
    }
    function removeCartItem(pid) { state.cart = state.cart.filter(i => i.productId !== pid); renderCart(); }
    function clearCart() { state.cart = []; document.getElementById("discountPercent").value = 0; renderCart(); showToast("Carrinho limpo"); }
    function renderCart() {
        let container = document.getElementById("cartList");
        if(state.cart.length === 0) { container.innerHTML = `<div style="text-align:center; padding:50px; color:var(--text-muted);">Carrinho vazio</div>`; refreshCartTotals(); return; }
        let html = "";
        for(let item of state.cart) {
            let p = state.products.find(pr => pr.id === item.productId);
            if(p) html += `<div class="cart-item"><div class="cart-item-icon">${p.icon}</div><div class="cart-item-info"><div class="cart-item-name">${p.name}</div><div class="cart-item-price">${formatCurrency(p.price)}</div></div><div class="qty-control"><button class="qty-btn" onclick="updateCartQty(${p.id},-1)">-</button><span style="margin:0 6px;">${item.qty}</span><button class="qty-btn" onclick="updateCartQty(${p.id},1)">+</button></div><div class="cart-item-total">${formatCurrency(p.price * item.qty)}</div><button style="background:none; border:none; font-size:18px; cursor:pointer;" onclick="removeCartItem(${p.id})">🗑️</button></div>`;
        }
        container.innerHTML = html;
        refreshCartTotals();
    }
    function refreshCartTotals() {
        let subtotal = state.cart.reduce((s,i)=>{ let p=state.products.find(pr=>pr.id===i.productId); return s+(p?p.price*i.qty:0); },0);
        let discPct = parseFloat(document.getElementById("discountPercent").value) || 0;
        let discVal = subtotal * (discPct/100);
        let total = subtotal - discVal;
        document.getElementById("cartSubtotal").innerText = formatCurrency(subtotal);
        document.getElementById("discountAmount").innerText = `- ${formatCurrency(discVal)}`;
        document.getElementById("cartTotalAmount").innerText = formatCurrency(total);
        return total;
    }

    // Pagamento
    function openPaymentModal() { if(state.cart.length===0) return; let total = refreshCartTotals(); document.getElementById("paymentTotalDisplay").innerText = formatCurrency(total); document.getElementById("cashSection").style.display = state.selectedPaymentMethod === "dinheiro" ? "block" : "none"; document.getElementById("cashReceivedInput").value = total; document.getElementById("changeInfo").innerHTML = ""; openModal("paymentModal"); }
    function finalizeSale() {
        let total = refreshCartTotals();
        let method = state.selectedPaymentMethod;
        let received = parseFloat(document.getElementById("cashReceivedInput").value) || 0;
        if(method === "dinheiro" && received < total) { showToast("Valor recebido insuficiente"); return; }
        let sale = {
            id: state.nextSaleId++, date: new Date().toISOString(),
            clientName: state.selectedClient ? state.selectedClient.name : "Consumidor Final",
            items: state.cart.map(i => { let p=state.products.find(pr=>pr.id===i.productId); return { name:p.name, price:p.price, qty:i.qty, total:p.price*i.qty }; }),
            subtotal: total + (total * (parseFloat(document.getElementById("discountPercent").value)/100)),
            discountPct: parseFloat(document.getElementById("discountPercent").value), total: total, payment: method, change: method==="dinheiro"? received-total : 0
        };
        for(let item of state.cart) { let p=state.products.find(pr=>pr.id===item.productId); if(p) p.stock = Math.max(0, p.stock - item.qty); }
        state.sales.push(sale);
        state.cart = [];
        renderCart();
        closeModal("paymentModal");
        showToast(`Venda #${sale.id} finalizada com sucesso!`);
        saveToLocalStorage();
        if(state.currentView === "reports") renderReports();
        filterProducts();
    }
    document.querySelectorAll(".pay-method").forEach(btn => btn.addEventListener("click", function() {
        state.selectedPaymentMethod = this.dataset.method;
        document.getElementById("cashSection").style.display = state.selectedPaymentMethod === "dinheiro" ? "block" : "none";
    }));

    // Clientes
    function openClientSelector() { renderClientSelectList(); openModal("clientSelectModal"); }
    function renderClientSelectList() {
        let search = document.getElementById("clientSearchField").value.toLowerCase();
        let filtered = state.clients.filter(c => c.name.toLowerCase().includes(search));
        let html = filtered.map(c => `<div style="padding: 12px; border-bottom:1px solid #eee; cursor:pointer;" onclick="selectClient(${c.id})"><strong>${c.name}</strong><br><small>${c.cpf}</small></div>`).join("");
        document.getElementById("clientSelectList").innerHTML = html || "<div>Nenhum cliente</div>";
    }
    function selectClient(id) {
        state.selectedClient = state.clients.find(c => c.id === id) || null;
        let name = state.selectedClient ? state.selectedClient.name : "Consumidor Final";
        document.getElementById("selectedClientName").innerHTML = name;
        closeModal("clientSelectModal");
    }
    function renderClientsList() {
        let html = state.clients.map(c => `<div style="background:white; border-radius:20px; padding:16px; display:flex; justify-content:space-between; align-items:center; border:1px solid var(--border-light);"><div><strong>${c.name}</strong><br>${c.cpf}</div><div><button class="btn-secondary" onclick="editClient(${c.id})">Editar</button> <button class="btn-secondary" style="background:var(--danger-bg);" onclick="deleteClient(${c.id})">Excluir</button></div></div>`).join("");
        document.getElementById("clientsListContainer").innerHTML = html || "<p>Nenhum cliente cadastrado</p>";
    }
    function openClientForm(client=null) {
        document.getElementById("editClientId").value = client?.id || "";
        document.getElementById("clientFullName").value = client?.name || "";
        document.getElementById("clientCpf").value = client?.cpf || "";
        document.getElementById("clientPhone").value = client?.phone || "";
        openModal("clientFormModal");
    }
    function saveClient() {
        let id = document.getElementById("editClientId").value;
        let name = document.getElementById("clientFullName").value.trim();
        if(!name) { showToast("Nome obrigatório"); return; }
        if(id) {
            let c = state.clients.find(c=>c.id==id);
            if(c) { c.name = name; c.cpf = document.getElementById("clientCpf").value; c.phone = document.getElementById("clientPhone").value; }
        } else {
            state.clients.push({ id: state.nextClientId++, name, cpf: document.getElementById("clientCpf").value, phone: document.getElementById("clientPhone").value, type: "comum" });
        }
        closeModal("clientFormModal");
        renderClientsList();
        saveToLocalStorage();
        showToast("Cliente salvo");
    }
    function editClient(id) { let c = state.clients.find(c=>c.id===id); if(c) openClientForm(c); }
    function deleteClient(id) { state.clients = state.clients.filter(c=>c.id!==id); renderClientsList(); saveToLocalStorage(); showToast("Cliente removido"); }

    // Produtos (gestão)
    function renderProductsManagement() {
        let html = state.products.map(p => `<div class="product-card"><div class="product-emoji">${p.icon}</div><div class="product-name">${p.name}</div><div>${formatCurrency(p.price)}</div><div>Estoque: ${p.stock}</div><div style="margin-top:12px;"><button class="btn-secondary" onclick="editProduct(${p.id})">Editar</button> <button class="btn-secondary" style="background:var(--danger-bg);" onclick="deleteProduct(${p.id})">Excluir</button></div></div>`).join("");
        document.getElementById("productsManagementList").innerHTML = html;
    }
    function openProductForm(product=null) {
        document.getElementById("editProductId").value = product?.id || "";
        document.getElementById("prodName").value = product?.name || "";
        document.getElementById("prodPrice").value = product?.price || "";
        document.getElementById("prodStock").value = product?.stock || "";
        document.getElementById("prodCategory").value = product?.category || "";
        document.getElementById("prodIcon").value = product?.icon || "📦";
        openModal("productFormModal");
    }
    function saveProduct() {
        let id = document.getElementById("editProductId").value;
        let name = document.getElementById("prodName").value.trim();
        if(!name) return;
        let prod = {
            id: id ? parseInt(id) : state.nextProductId++,
            name, price: parseFloat(document.getElementById("prodPrice").value), stock: parseInt(document.getElementById("prodStock").value),
            category: document.getElementById("prodCategory").value, icon: document.getElementById("prodIcon").value, cost: 0
        };
        if(id) { let idx = state.products.findIndex(p=>p.id==id); if(idx!==-1) state.products[idx] = prod; }
        else state.products.push(prod);
        closeModal("productFormModal");
        renderProductsManagement();
        filterProducts();
        saveToLocalStorage();
        showToast("Produto salvo");
    }
    function editProduct(id) { let p = state.products.find(p=>p.id===id); if(p) openProductForm(p); }
    function deleteProduct(id) { state.products = state.products.filter(p=>p.id!==id); renderProductsManagement(); filterProducts(); renderCart(); saveToLocalStorage(); showToast("Produto excluído"); }

    // Vendas pendentes
    function holdCurrentCart() { if(state.cart.length===0) return; state.heldOrders.push({ id: state.nextHeldId++, cart: JSON.parse(JSON.stringify(state.cart)), client: state.selectedClient, date: new Date() }); state.cart = []; renderCart(); saveToLocalStorage(); showToast("Venda guardada nas pendentes"); }
    function openHeldOrdersModal() {
        let html = state.heldOrders.map(h => `<div style="padding: 14px; border-bottom:1px solid #eee;"><strong>#${h.id}</strong> - ${h.client?.name || "Consumidor"} - ${h.cart.reduce((s,i)=>s+i.qty,0)} itens <button class="btn-secondary" style="padding:4px 12px;" onclick="restoreHeld(${h.id})">Restaurar</button> <button onclick="deleteHeld(${h.id})" style="color:var(--danger); margin-left: 8px;">Excluir</button></div>`).join("");
        document.getElementById("heldOrdersListContainer").innerHTML = html || "<p>Nenhuma venda pendente</p>";
        openModal("heldOrdersModal");
    }
    function restoreHeld(id) { let order = state.heldOrders.find(o=>o.id===id); if(order) { state.cart = order.cart; state.selectedClient = order.client; selectClient(order.client?.id); state.heldOrders = state.heldOrders.filter(o=>o.id!==id); renderCart(); closeModal("heldOrdersModal"); showToast("Venda restaurada"); saveToLocalStorage(); } }
    function deleteHeld(id) { state.heldOrders = state.heldOrders.filter(o=>o.id!==id); openHeldOrdersModal(); saveToLocalStorage(); }

    // Relatórios
    function renderReports() {
        let totalSales = state.sales.length;
        let revenue = state.sales.reduce((s,v)=>s+v.total,0);
        document.getElementById("statsCards").innerHTML = `<div style="background:white; border-radius:24px; padding:20px; flex:1;"><div style="color:var(--text-muted);">Total de vendas</div><div style="font-size:32px; font-weight:700;">${totalSales}</div></div><div style="background:white; border-radius:24px; padding:20px; flex:1;"><div style="color:var(--text-muted);">Faturamento</div><div style="font-size:32px; font-weight:700; color:var(--accent);">${formatCurrency(revenue)}</div></div>`;
        let rows = state.sales.slice().reverse().map(s => `<tr><td>#${s.id}</td><td>${new Date(s.date).toLocaleString()}</td><td>${s.clientName}</td><td>${formatCurrency(s.total)}</td><td>${s.payment}</td></tr>`).join("");
        document.getElementById("salesHistoryBody").innerHTML = rows || "<tr><td colspan='5'>Nenhuma venda</td></tr>";
    }

    // Configurações
    function openSettingsModal() { document.getElementById("storeNameInput").value = state.settings.storeName; document.getElementById("storeCnpjInput").value = state.settings.cnpj; openModal("settingsModal"); }
    function saveSettings() { state.settings.storeName = document.getElementById("storeNameInput").value; state.settings.cnpj = document.getElementById("storeCnpjInput").value; closeModal("settingsModal"); saveToLocalStorage(); showToast("Configurações salvas"); }
    function resetSystem() { if(confirm("Resetar todos os dados? Esta ação é irreversível.")) { localStorage.removeItem("bazarexpress_data"); location.reload(); } }

    // Event listeners e inicialização
    document.querySelectorAll(".nav-btn[data-view]").forEach(btn => btn.addEventListener("click", () => switchView(btn.dataset.view)));
    window.addEventListener("load", () => {
        loadFromLocalStorage();
        renderCategories();
        filterProducts();
        renderCart();
        switchView("pdv");
        selectClient(null);
    });
    // Expor funções globais
    window.addToCart = addToCart; window.updateCartQty = updateCartQty; window.removeCartItem = removeCartItem;
    window.clearCart = clearCart; window.openPaymentModal = openPaymentModal; window.finalizeSale = finalizeSale;
    window.openClientSelector = openClientSelector; window.selectClient = selectClient; window.saveClient = saveClient;
    window.editClient = editClient; window.deleteClient = deleteClient; window.openClientForm = openClientForm;
    window.saveProduct = saveProduct; window.editProduct = editProduct; window.deleteProduct = deleteProduct;
    window.openProductForm = openProductForm; window.holdCurrentCart = holdCurrentCart; window.openHeldOrdersModal = openHeldOrdersModal;
    window.restoreHeld = restoreHeld; window.deleteHeld = deleteHeld; window.saveSettings = saveSettings; window.resetSystem = resetSystem;
    window.openSettingsModal = openSettingsModal; window.setCategory = setCategory; window.filterProducts = filterProducts;
    window.renderProductsManagement = renderProductsManagement; window.renderClientsList = renderClientsList;
    window.renderReports = renderReports; window.closeModal = closeModal; window.showToast = showToast;
</script>
</body>
</html>
